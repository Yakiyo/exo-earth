<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TerraNova - Discover Analog Sites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>

  <style>
    /* Specific styles for the welcome page */
    body {
      /* overflow: hidden removed to allow scrolling */
    }
    
    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      min-height: 100vh;
      z-index: 0;
    }

    .welcome-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      z-index: 10;
      padding-top: 60px; /* Space for the topbar */
    }

    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 5%;
      max-width: 50%;
    }

    .globe-panel {
      flex: 1;
      position: relative;
    }

    #welcomeGlobeCanvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .welcome-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      /* Remove background-clip gradient to fix clipping and match theme */
      color: var(--accent);
      line-height: 1.1;
      opacity: 0;
      transform: translateY(30px);
    }

    .subtext {
      font-size: 1.5rem;
      line-height: 1.6;
      color: var(--ink-2);
      margin-bottom: 2.5rem;
      max-width: 480px;
      opacity: 0;
      transform: translateY(30px);
    }
    
    /* Using .primary class from styles.css for the button, adding animation styles */
    .explore-btn {
      align-self: flex-start;
      opacity: 0;
      transform: translateY(30px);
      padding: 12px 24px;
      font-size: 1.125rem;
    }

    .welcome-topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      background: transparent;
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .welcome-container {
        flex-direction: column;
      }
      .content-panel {
        max-width: 100%;
        padding: 5%;
        padding-top: 100px;
        align-items: center;
        text-align: center;
      }
      .welcome-title {
        font-size: 3rem;
      }
      .subtext {
        font-size: 1.2rem;
      }
      .explore-btn {
        align-self: center;
      }
      .globe-panel {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  
  <header class="topbar welcome-topbar">
    <div class="brand">
      <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; color: inherit;">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9" fill="var(--accent)"/>
          <ellipse cx="16" cy="16" rx="15" ry="5" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-25 16 16)"/>
        </svg>
        <div>
          <h1>TerraNova</h1>
        </div>
      </a>
    </div>
    <nav class="main-nav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="targets.html" class="nav-link">Targets</a>
      <a href="finder.html#target=moon" class="nav-link">Finder</a>
    </nav>
  </header>

  <div class="welcome-container">
    <div class="content-panel">
      <h1 class="welcome-title" id="title">TerraNova</h1>
      <p class="subtext" id="subtext">Discover places on Earth that act as analogs for Moon and Mars base sites, scored from NASA data.</p>
      <button class="primary explore-btn" id="exploreBtn" type="button">Start Your Journey</button>
    </div>
    <div class="globe-panel">
      <canvas id="welcomeGlobeCanvas"></canvas>
    </div>
  </div>





  <script type="module" src="welcome.js"></script>
</body>
</html>
